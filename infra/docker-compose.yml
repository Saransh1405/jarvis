name: jarvis

services:
  # Local Postgres (optional). Use profile local-postgres: `docker compose --profile local-postgres up`
  # With Neon, set DATABASE_URL + POSTGRES_DSN in .env and leave this service off.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   profiles: ["local-postgres"]
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-jarvis}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
  #     POSTGRES_DB: ${POSTGRES_DB:-jarvis}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ../go/migrations:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 10s
  #   networks:
  #     - jarvis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jarvis

  api:
    build:
      context: ../python
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PYTHON_API_HOST: 0.0.0.0
      PYTHON_API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - jarvis

  gateway:
    build:
      context: ../go
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      PYTHON_API_URL: http://api:8000
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_TRACING_ENABLED: "false"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - jarvis

networks:
  jarvis:
    driver: bridge

