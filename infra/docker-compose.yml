name: jarvis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jarvis

  api:
    image: saransh76/jarvis-api:${JARVIS_IMAGE_TAG:-2026.10.17}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      PYTHON_API_HOST: 0.0.0.0
      PYTHON_API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - jarvis

  worker:
    image: saransh76/jarvis-api:${JARVIS_IMAGE_TAG:-2026.10.17}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
    command: ["python", "-m", "jarvis_ai.jobs"]
    networks:
      - jarvis

  gateway:
    image: saransh76/jarvis-gateway:${JARVIS_IMAGE_TAG:-2026.10.17}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      PYTHON_API_URL: http://api:8000
      POSTGRES_DSN: ${POSTGRES_DSN:-${DATABASE_URL}}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_TRACING_ENABLED: "false"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - jarvis

networks:
  jarvis:
    driver: bridge
